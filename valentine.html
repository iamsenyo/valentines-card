<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root{
        --bg:#ffdddd;          /* page background (deep red) */
        --card:#ffffff;
        --text:#333;
        --shadow:0 4px 12px rgba(0,0,0,.1);
    }
    body{
        margin:0; padding:0; 
        background:var(--bg); 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display:flex; justify-content:center; align-items:center;
        min-height:100vh; 
        overflow:hidden; /* hearts that go off‑screen are hidden */
    }
    .card{
        background:var(--card);
        border-radius:20px;
        box-shadow:var(--shadow);
        text-align:center;
        padding:30px 20px;
        max-width: 90%;
        width:400px;
        position:relative;
    }
    .card img{
        width:80%; max-width:200px;
        margin-bottom:20px;
    }
    .card h1{
        font-size:1.8rem;
        color:var(--text);
        margin:0 0 25px 0;
    }
    .buttons{
        display:flex;
        justify-content:center;
        gap:15px;
    }
    button{
        padding:12px 25px;
        font-size:1rem;
        border:none;
        border-radius:30px;
        cursor:pointer;
        transition:all .2s ease;
        box-shadow:var(--shadow);
    }
    button#yes{
        background:#ff4d9a;
        color:#fff;
    }
    button#no{
        background:#ff99c8;
        color:#fff;
    }
    button:hover{
        transform:scale(1.05);
    }

    /* ---------------- Heart Rain ---------------- */
    @keyframes fall{
        0%{transform:translateY(-10px) rotate(0deg); opacity:0;}
        20%{opacity:1;}
        100%{transform:translateY(110vh) rotate(720deg); opacity:0;}
    }
    .heart{
        position:absolute;
        top:-10px;
        font-size:3rem;          /* 200 % larger than the original 1.5rem */
        color:#8B0000;           /* default deep‑red; overridden inline */
        animation-timing-function:ease-in-out;
        pointer-events:none;
    }

    @media (max-width:500px){
        .card{padding:20px 15px;}
        .card h1{font-size:1.5rem;}
    }
</style>
</head>
<body>

    <h1>Will you be my Valentine? ❤️</h1>
    <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>
</div>

<script>
/* ---------- No button teleport logic ---------- */
const noBtn = document.getElementById('no');
function teleport(){
    const card = document.getElementById('card');
    const cardRect = card.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = cardRect.width - btnRect.width;
    const maxY = cardRect.height - btnRect.height;

    const randX = Math.random() * maxX;
    const randY = Math.random() * maxY;

    noBtn.style.position = 'absolute';
    noBtn.style.left = `${randX}px`;
    noBtn.style.top = `${randY}px`;
}
noBtn.addEventListener('mouseenter', teleport);
noBtn.addEventListener('click', teleport);

/* ---------- Yes button action ---------- */
const yesBtn = document.getElementById('yes');
yesBtn.addEventListener('click', function(){
    const card = document.getElementById('card');
    // Hide question & buttons
    card.querySelector('h1').style.display = 'none';
    card.querySelector('.buttons').style.display = 'none';

    // Add message
    const msg = document.createElement('p');
    msg.style.fontSize = '1.1rem';
    msg.style.color = '#444';
    msg.style.lineHeight = '1.4';
    msg.style.marginTop = '20px';
    msg.innerText = "Congratulations on surviving another year of my nonsense. You deserve a trophy, but all I got you was this card .";
    card.appendChild(msg);

    /* ------------- Start heart rain in seven pink shades ------------- */
    startHeartRain('#FFC0CB'); // Pink
    startHeartRain('#FFB6C1'); // Light Pink
    startHeartRain('#FF1493'); // Deep Pink
    startHeartRain('#FF00FF'); // Magenta
    startHeartRain('#FF6EB4'); // Pinkish‑red
    startHeartRain('#FFD1DC'); // Blush Pink
    startHeartRain('#FFDAB9'); // Peach Puff
});

/* ---------- Heart Rain logic (colour can be supplied) ---------- */
function startHeartRain(heartColor = '#8B0000') {
    const maxInterval = 150;   // spawn a heart every 150 ms

    const heartInterval = setInterval(() => {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = '♥';

        // horizontal start position
        heart.style.left = Math.random() * window.innerWidth + 'px';

        // <-- set the colour you passed (overrides the CSS colour)
        heart.style.color = heartColor;

        // random fall duration (4–7 s)
        const duration = 4 + Math.random() * 3;
        heart.style.animation = `fall ${duration}s ease-in-out forwards`;

        // put it on the page
        document.body.appendChild(heart);

        // remove it after the animation completes
        setTimeout(() => heart.remove(), duration * 1000);
    }, maxInterval);
}
</script>
</body>
</html>
